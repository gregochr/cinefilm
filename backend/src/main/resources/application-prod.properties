# Prod profile: PostgreSQL from the environment. No fallbacks: a missing value must fail start-up.
spring.datasource.url=${CINEFILM_DB_URL}
spring.datasource.username=${CINEFILM_DB_USER}
spring.datasource.password=${CINEFILM_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
