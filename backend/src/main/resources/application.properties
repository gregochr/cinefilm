spring.application.name=cinefilm
server.port=8080

# Database: PostgreSQL in dev and prod (see application-dev/prod.properties); the test profile uses in-memory H2.
# Flyway owns the schema; Hibernate only validates it.
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.flyway.enabled=true

# Session cookie: HTTP-only, SameSite=Lax, 30 days idle ("remember this Mac").
# Tomcat adds Secure automatically when the request arrived over HTTPS.
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=30d

# Application time zone: "this week's theme" rolls over on Monday here, and "recently added" and "not watched in
# years" are measured here, whatever zone the machine or container is in. Explicit on purpose.
cinefilm.time-zone=Europe/London

# Actuator: only health and info are exposed (everything else is 404). The container group is what Docker's
# healthcheck and the deploy smoke call: "the process is up and reaches its database", status only.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.group.container.include=db,ping
management.endpoint.health.group.container.show-components=never
management.endpoint.health.group.container.show-details=never
# /actuator/info carries git.commit.id (the full commit) from git.properties, written at build time.
management.info.git.mode=full

# Single-user password (env CINEFILM_PASSWORD); empty means the dev fallback with a warning.
cinefilm.password=${CINEFILM_PASSWORD:}
cinefilm.sample-video=${CINEFILM_SAMPLE_VIDEO:}

# Behind `tailscale serve` (HTTPS terminated on the host, proxied to 127.0.0.1:8090): trust X-Forwarded-Proto from
# Tomcat internal proxies (loopback and private ranges) so the session cookie gets Secure over HTTPS.
server.forward-headers-strategy=native

# Compress text: JSON (the search index is the large one: about 4x smaller on the wire), each rung's media playlist,
# the JavaScript and CSS bundles and subtitles. Streams, segments and artwork are binary and untouched.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml,application/vnd.apple.mpegurl,text/vtt
server.compression.min-response-size=2KB

# Library scan and direct play. The library folder holds the films (a read-only mount in production); media paths are
# stored relative to it. The cache folder holds generated WebVTT subtitles. TMDB's Read Access Token comes from the
# environment only. Scans also run nightly at 04:30 (cinefilm.time-zone) and at start-up on an empty library.
cinefilm.library.root=${CINEFILM_LIBRARY_ROOT:/media}
cinefilm.cache.dir=${CINEFILM_CACHE_DIR:/app/cache}
cinefilm.tools.ffprobe=ffprobe
cinefilm.tools.ffmpeg=ffmpeg
cinefilm.tmdb.token=${TMDB_READ_TOKEN:}
cinefilm.tmdb.base-url=https://api.themoviedb.org
cinefilm.scan.schedule=true

# IMDb and Rotten Tomatoes ratings from OMDb (https://www.omdbapi.com). The API key comes from the environment only;
# blank switches ratings off (no requests). The free tier allows 1,000 requests a day; we stop at the daily limit
# (counted per UTC day). A refresh also runs after each scan and Plex import, and daily at 05:30 (cinefilm.time-zone).
cinefilm.omdb.api-key=${OMDB_API_KEY:}
cinefilm.omdb.base-url=https://www.omdbapi.com
cinefilm.omdb.daily-limit=900

# Forced English subtitles from OpenSubtitles (https://api.opensubtitles.com). The API key comes from the environment
# only; blank switches the search off (no requests). Downloads (to check the owner's forced subtitle files) also need
# the account's username and password (environment only) and are off while either is blank; the search keeps working.
# The downloads a day (counted per UTC day) are the account's own allowance, read from the login reply (20 on a free
# account, 1000 on VIP; 20 until it is known), and daily-download-limit only caps that: the owner's own ceiling. The User-Agent is
# "CineFilm v<version>", the version being the image tag (APP_VERSION). Films are searched after each scan and Plex
# import, at start-up and daily at 06:00 (cinefilm.time-zone).
cinefilm.version=${APP_VERSION:1}
cinefilm.opensubtitles.api-key=${OPENSUBTITLES_API_KEY:}
cinefilm.opensubtitles.username=${OPENSUBTITLES_USERNAME:}
cinefilm.opensubtitles.password=${OPENSUBTITLES_PASSWORD:}
cinefilm.opensubtitles.base-url=https://api.opensubtitles.com
cinefilm.opensubtitles.daily-download-limit=1000

# Timing check of the forced subtitle files against the full English subtitle track inside each film's own file
# (docs/engineering/forced-subtitles-plan.md, phase 3a). It reads each film file once (ffprobe over the whole file, minutes
# over SMB, niced, 20 minute timeout), only while no HLS session is encoding, after each scan, at start-up and daily at
# 07:00 (cinefilm.time-zone). Switch it off here.
cinefilm.subtitles.timing-check.enabled=true

# Credits detection (docs/engineering/credits-detection-plan.md, phase 1b). Works out where each film's end credits start
# from the picture (ffmpeg reads single frames from the last 35 minutes of the last part of every edition, niced, under
# <cinefilm.cache.dir>/credits), after each scan, at start-up and hourly when a run was left. One film at a time, and it
# waits while a film is transcoding or playback progress was reported in the last 5 minutes. It only stores what it finds
# (credits_detection); nothing uses the result yet. Switch it off here.
cinefilm.credits.enabled=true

# Credits dataset job (docs/engineering/credits-classifier-plan.md, "Frames: the dataset job"). Reads, for every film with a
# usable Plex credits marker, the frames a classifier is trained on (coarse and dense, grey PNG and colour JPEG) into
# <dir>/frames/<media file id>/, one film at a time on the credits thread. It stands aside for playback and for the credits
# detection's own due films, writes nothing to the database, and is started and stopped from the Admin routes
# (/api/admin/credits/dataset). Off by default. After a restart it starts again only if <dir>/running exists. <dir> must not
# be inside <cinefilm.cache.dir>/credits, which is wiped at start-up. nice is ffmpeg's niceness; the job stops when the disk
# holding <dir> has less than min-free-gb (a GB is 10^9 bytes) usable; out-dir is where the tool runs write their results.
cinefilm.credits.dataset.enabled=false
cinefilm.credits.dataset.dir=${cinefilm.cache.dir}/credits-dataset
cinefilm.credits.dataset.out-dir=${cinefilm.cache.dir}/credits-dataset-out
cinefilm.credits.dataset.nice=19
cinefilm.credits.dataset.min-free-gb=15

# Plex import (docs/engineering/plex-import-plan.md). The importer only ever GETs from PLEX_URL, with PLEX_TOKEN in the
# X-Plex-Token header; it is off when either is blank. The path prefix is where Plex sees the library (what to strip
# from its file paths to get CineFilm's relative ones). Artwork from Plex is stored in the artwork dir, a persistent
# data mount that is backed up with the database (Plex's copies cannot be fetched once Plex is gone).
cinefilm.plex.url=${PLEX_URL:}
cinefilm.plex.token=${PLEX_TOKEN:}
cinefilm.plex.path-prefix=${PLEX_PATH_PREFIX:/Volumes/Media Library/Movies/}
cinefilm.artwork.dir=${CINEFILM_ARTWORK_DIR:/app/artwork}

# Virtual threads: playlist/segment requests wait on the encoder without holding a platform thread.
spring.threads.virtual.enabled=true

# Transcoding: mode auto|vaapi|software|unavailable (auto probes ffmpeg once at start-up), the VAAPI render node,
# ffmpeg's thread bound, its niceness, and whether the keyframe index job also runs at start-up.
cinefilm.transcode.mode=auto
cinefilm.transcode.device=/dev/dri/renderD128
cinefilm.transcode.threads=2
cinefilm.transcode.nice=10
cinefilm.transcode.index-on-startup=true

# Sessions: the encoder stops after idle-stop without a request, the session is deleted after expiry (it is
# remembered and a later request rebuilds it), and idle sessions are evicted while hls/ holds more than
# hls-cap-bytes (5 GB).
cinefilm.transcode.idle-stop=2m
cinefilm.transcode.expiry=10m
cinefilm.transcode.hls-cap-bytes=5368709120
