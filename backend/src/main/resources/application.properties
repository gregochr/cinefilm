spring.application.name=cinefilm
server.port=8080

# Database: H2 file database for now; SQL stays PostgreSQL-compatible (Flyway owns the schema).
spring.datasource.url=jdbc:h2:file:./data/cinefilm;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.flyway.enabled=true

# Session cookie: HTTP-only, SameSite=Lax, 30 days idle ("remember this Mac").
# Tomcat adds Secure automatically when the request arrived over HTTPS.
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=30d

# Single-user password (env CINEFILM_PASSWORD); empty means the dev fallback with a warning.
cinefilm.password=${CINEFILM_PASSWORD:}
cinefilm.sample-video=${CINEFILM_SAMPLE_VIDEO:}
