spring.application.name=cinefilm
server.port=8080

# Database: PostgreSQL in dev and prod (see application-dev/prod.properties); the test profile uses in-memory H2.
# Flyway owns the schema; Hibernate only validates it.
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.flyway.enabled=true

# Session cookie: HTTP-only, SameSite=Lax, 30 days idle ("remember this Mac").
# Tomcat adds Secure automatically when the request arrived over HTTPS.
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=30d

# Application time zone: "this week's theme" rolls over on Monday here, and "recently added" and "not watched in
# years" are measured here, whatever zone the machine or container is in. Explicit on purpose.
cinefilm.time-zone=Europe/London

# Actuator: only health and info are exposed (everything else is 404). The container group is what Docker's
# healthcheck and the deploy smoke call: "the process is up and reaches its database", status only.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.group.container.include=db,ping
management.endpoint.health.group.container.show-components=never
management.endpoint.health.group.container.show-details=never
# /actuator/info carries git.commit.id (the full commit) from git.properties, written at build time.
management.info.git.mode=full

# Single-user password (env CINEFILM_PASSWORD); empty means the dev fallback with a warning.
cinefilm.password=${CINEFILM_PASSWORD:}
cinefilm.sample-video=${CINEFILM_SAMPLE_VIDEO:}

# Behind `tailscale serve` (HTTPS terminated on the host, proxied to 127.0.0.1:8090): trust X-Forwarded-Proto from
# Tomcat internal proxies (loopback and private ranges) so the session cookie gets Secure over HTTPS.
server.forward-headers-strategy=native


# Library scan and direct play. The library folder holds the films (a read-only mount in production); media paths are
# stored relative to it. The cache folder holds generated WebVTT subtitles. TMDB's Read Access Token comes from the
# environment only. Scans also run nightly at 04:30 (cinefilm.time-zone) and at start-up on an empty library.
cinefilm.library.root=${CINEFILM_LIBRARY_ROOT:/media}
cinefilm.cache.dir=${CINEFILM_CACHE_DIR:/app/cache}
cinefilm.tools.ffprobe=ffprobe
cinefilm.tools.ffmpeg=ffmpeg
cinefilm.tmdb.token=${TMDB_READ_TOKEN:}
cinefilm.tmdb.base-url=https://api.themoviedb.org
cinefilm.scan.schedule=true

# Plex import (docs/engineering/plex-import-plan.md). The importer only ever GETs from PLEX_URL, with PLEX_TOKEN in the
# X-Plex-Token header; it is off when either is blank. The path prefix is where Plex sees the library (what to strip
# from its file paths to get CineFilm's relative ones). Artwork from Plex is stored in the artwork dir, a persistent
# data mount that is backed up with the database (Plex's copies cannot be fetched once Plex is gone).
cinefilm.plex.url=${PLEX_URL:}
cinefilm.plex.token=${PLEX_TOKEN:}
cinefilm.plex.path-prefix=${PLEX_PATH_PREFIX:/Volumes/Media Library/Movies/}
cinefilm.artwork.dir=${CINEFILM_ARTWORK_DIR:/app/artwork}

# Virtual threads: playlist/segment requests wait on the encoder without holding a platform thread.
spring.threads.virtual.enabled=true

# Transcoding: mode auto|vaapi|software|unavailable (auto probes ffmpeg once at start-up), the VAAPI render node,
# ffmpeg's thread bound, its niceness, and whether the keyframe index job also runs at start-up.
cinefilm.transcode.mode=auto
cinefilm.transcode.device=/dev/dri/renderD128
cinefilm.transcode.threads=2
cinefilm.transcode.nice=10
cinefilm.transcode.index-on-startup=true

# Sessions: the encoder stops after idle-stop without a request, the session is deleted after expiry (then 404), and
# idle sessions are evicted while hls/ holds more than hls-cap-bytes (5 GB).
cinefilm.transcode.idle-stop=2m
cinefilm.transcode.expiry=10m
cinefilm.transcode.hls-cap-bytes=5368709120
