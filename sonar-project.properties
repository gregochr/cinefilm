# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml (CI-based; Automatic Analysis is OFF).
# All paths are relative to the repo root, where the scanner runs. Why CI-based: Java analysis needs the compiled
# classes and the gate should see real coverage, so the job downloads the backend and frontend jobs' artifacts into
# exactly these paths instead of rebuilding.
sonar.projectKey=gregochr_cinefilm
sonar.organization=gregochr
sonar.projectName=cinefilm

# ── Scope ──
# Product code plus the things Automatic Analysis was already covering: shell scripts, the Dockerfiles, the compose
# file and the workflows (shell, Docker and GitHub Actions rules). Test code is declared separately below.
sonar.sources=backend/src/main/java,frontend/src,scripts,Dockerfile,deploy,.github
sonar.tests=backend/src/test/java,frontend/src,scripts/test
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,scripts/test/**
# frontend/src and scripts are both sources and test roots above, so exclude the test files from the sources:
# no file may be both.
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,scripts/test/**

# Test fixtures are deliberately repetitive.
sonar.cpd.exclusions=frontend/src/test/fixtures/**

# 2026-11-15: scripts/train-feed-logger.py is left out of coverage, not out of analysis. Its tests are
# scripts/test/train-feed-logger.test.sh (run by the Shell job), which drive it as a program; Sonar reads no
# coverage from a shell test, so its lines would always count as uncovered.
# 2026-11-16: the home replay rig's files (scripts/replay/) are left out of coverage for the same reason. Their tests
# are scripts/test/replay/*.test.mjs, run with `node --test` by scripts/test/replay-rig.test.sh in the Shell job, and
# Sonar is given no coverage report from that run. They stay in analysis. One entry per file, no wildcard.
# What drives Chrome (drive.mjs's main, cdp.mjs's launch and socket, make-template.mjs's encoding) cannot run in CI
# at all.
# 2026-11-17: the train viewer (scripts/replay/viewer.mjs, guard.mjs, viewing.mjs and summary.mjs) is left out for the same reason; its tests are in the same run.
sonar.coverage.exclusions=scripts/train-feed-logger.py,scripts/replay/trace.mjs,scripts/replay/ts.mjs,scripts/replay/link.mjs,scripts/replay/standin.mjs,scripts/replay/text.mjs,scripts/replay/cdp.mjs,scripts/replay/make-template.mjs,scripts/replay/drive.mjs,scripts/replay/analyse.mjs,scripts/replay/viewer.mjs,scripts/replay/guard.mjs,scripts/replay/viewing.mjs,scripts/replay/summary.mjs

# ── Java ──
sonar.java.binaries=backend/target/classes
sonar.java.source=25
# Dependency jars (copied by the backend job) so Spring, Hibernate and Jakarta types resolve; test classes for the tests.
sonar.java.libraries=backend/target/sonar-libs/*.jar
sonar.java.test.binaries=backend/target/test-classes
sonar.java.test.libraries=backend/target/sonar-libs/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ── JavaScript ──
# frontend/coverage/lcov.sonar.info is the frontend job's lcov.info with `SF:` rewritten to start with `frontend/`
# (its paths are relative to frontend/); the sonar job writes it.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.sonar.info
sonar.sourceEncoding=UTF-8

# ── Accepted findings (2026-11-10, 2026-11-15) ──
# One entry per finding: exactly one rule and one file each, no wildcards. Reasons are in the comments.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7

# 2026-11-10: java:S5443 accepted. Files.createTempFile creates the file atomically with an unpredictable name and
# owner-only permissions (0600 on POSIX), it is deleted in finally, and the process runs as a dedicated non-root user.
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S5443
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/src/main/java/gregochr/cinefilm/library/ProcessCommandRunner.java

# 2026-11-10: java:S4502 accepted. Spring CSRF is disabled deliberately and replaced by CsrfHeaderFilter, which
# requires X-CineFilm: 1 on every non-safe method with no exemptions (CsrfHeaderFilterTest, AuthApiTest).
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S4502
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/src/main/java/gregochr/cinefilm/auth/SecurityConfig.java

# 2026-11-15: python:S5332 accepted for the plain-http feed address in DEFAULT_BASES. (The entry covers the whole
# file, as every entry here does: look at any other http address added to it.) The script asks a train's own
# Wi-Fi system for its status, and that system is reported to answer over plain http: whether it still does is
# one of the things the script exists to find out. https is listed first and is the one used whenever it answers,
# but it is no stronger a promise: an https answer whose certificate is refused is read too and marked untrusted.
# What the feed says is logged and shown, and decides nothing beyond whether an address or one of its parts counts
# as answering. A request is an ordinary GET with a fixed User-Agent, callback=cb and a time stamp: no credential,
# cookie or personal data. The answer is limited in size and depth and printed only as printable ASCII.
# SECURITY.md rule 7 records this.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/train-feed-logger.py

# 2026-11-17: java:S6218 accepted for the private records Answer and Attempt in PlexClient (the rule wants equals,
# hashCode and toString overridden for the byte[] in them). Neither is ever compared, hashed, put in a collection or
# printed: each is built from one response, read through its accessors and dropped, and the log lines name the call
# and the status, never the record. PlexModels.PlexImage, the public one, does override all three.
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S6218
sonar.issue.ignore.multicriteria.e4.resourceKey=backend/src/main/java/gregochr/cinefilm/plex/PlexClient.java

# 2026-11-20: java:S6218 accepted for the internal records FilmEmbeddings (float[][] coarse and dense) in EmbeddingCursor. Each is built once per film or per run, read
# through its accessors and dropped: it is never compared with equals, hashed, collected as a map or set key, or
# printed (the log lines name the film and the run, never the record), so the array identity equals the rule warns of
# can never matter.
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S6218
sonar.issue.ignore.multicriteria.e5.resourceKey=backend/src/main/java/gregochr/cinefilm/credits/learn/EmbeddingCursor.java

# 2026-11-20: java:S6218 accepted for the internal records TrainRows (long[], byte[]) and its Kept (double[] features) in TrainRows. Each is built once per film or per run, read
# through its accessors and dropped: it is never compared with equals, hashed, collected as a map or set key, or
# printed (the log lines name the film and the run, never the record), so the array identity equals the rule warns of
# can never matter.
sonar.issue.ignore.multicriteria.e6.ruleKey=java:S6218
sonar.issue.ignore.multicriteria.e6.resourceKey=backend/src/main/java/gregochr/cinefilm/credits/learn/TrainRows.java

# 2026-11-20: java:S6218 accepted for the internal records Prediction (double[] coarseP and denseP) in FilmScore. Each is built once per film or per run, read
# through its accessors and dropped: it is never compared with equals, hashed, collected as a map or set key, or
# printed (the log lines name the film and the run, never the record), so the array identity equals the rule warns of
# can never matter.
sonar.issue.ignore.multicriteria.e7.ruleKey=java:S6218
sonar.issue.ignore.multicriteria.e7.resourceKey=backend/src/main/java/gregochr/cinefilm/credits/learn/FilmScore.java
