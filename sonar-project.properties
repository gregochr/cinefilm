# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml (CI-based; Automatic Analysis is OFF).
# All paths are relative to the repo root, where the scanner runs. Why CI-based: Java analysis needs the compiled
# classes and the gate should see real coverage, so the job downloads the backend and frontend jobs' artifacts into
# exactly these paths instead of rebuilding.
sonar.projectKey=gregochr_cinefilm
sonar.organization=gregochr
sonar.projectName=cinefilm

# ── Scope ──
# Product code plus the things Automatic Analysis was already covering: shell scripts, the Dockerfiles, the compose
# file and the workflows (shell, Docker and GitHub Actions rules). Test code is declared separately below.
sonar.sources=backend/src/main/java,frontend/src,scripts,Dockerfile,deploy,.github
sonar.tests=backend/src/test/java,frontend/src,scripts/test
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,scripts/test/**
# frontend/src and scripts are both sources and test roots above, so exclude the test files from the sources:
# no file may be both.
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,scripts/test/**

# Test fixtures are deliberately repetitive.
sonar.cpd.exclusions=frontend/src/test/fixtures/**

# ── Java ──
sonar.java.binaries=backend/target/classes
sonar.java.source=25
# Dependency jars (copied by the backend job) so Spring, Hibernate and Jakarta types resolve; test classes for the tests.
sonar.java.libraries=backend/target/sonar-libs/*.jar
sonar.java.test.binaries=backend/target/test-classes
sonar.java.test.libraries=backend/target/sonar-libs/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ── JavaScript ──
# frontend/coverage/lcov.sonar.info is the frontend job's lcov.info with `SF:` rewritten to start with `frontend/`
# (its paths are relative to frontend/); the sonar job writes it.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.sonar.info
sonar.sourceEncoding=UTF-8
