<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CineFilm — Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#EDE6DA;text-decoration:none}a:hover{color:#E8B25A}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 600px; background: #000; color: #EDE6DA; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(80% 70% at 60% 40%, #2E4256 0%, #16202A 50%, #050607 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8C9AA8; letter-spacing: 0.1em">VIDEO · HTML5</div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 24px 32px 60px; background: linear-gradient(to bottom, rgba(0,0,0,0.65), rgba(0,0,0,0)); display: flex; align-items: center; gap: 16px">
    <a href="A-Detail.dc.html" aria-label="Back to Heat" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(14,12,10,0.5)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1">Heat</span>
      <span style="font-size: 13px; color: #A39A8B">1995</span>
    </div>
    <div style="flex: 1"></div>
    <div role="status" aria-label="Playback quality and network" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(14,12,10,0.55); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #D5CCBE">
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #9FD3A8"></span>{{indicator}}</div>
  </div>

  <sc-if value="{{qOpen}}" hint-placeholder-val="{{ true }}">
    <div role="menu" aria-label="Quality" style="position: absolute; right: 32px; bottom: 156px; width: 300px; background: rgba(20,17,14,0.96); border: 1px solid #2A251F; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5)">
      <div style="padding: 10px 12px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #A39A8B">Quality</div>
      <sc-for list="{{quals}}" as="o" hint-placeholder-count="5">
        <button role="menuitemradio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; border: 0; cursor: pointer; text-align: left; background: {{o.bg}}; color: #EDE6DA; font: 500 14px Inter, system-ui, sans-serif">
          <span style="width: 16px; color: #E8B25A">{{o.tick}}</span><span style="flex: 1">{{o.label}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A39A8B">{{o.note}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{sOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Audio and subtitles" style="position: absolute; right: 120px; bottom: 156px; width: 600px; background: rgba(20,17,14,0.96); border: 1px solid #2A251F; border-radius: 12px; padding: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.5)">
      <div role="menu" aria-label="Audio" style="display: flex; flex-direction: column">
        <div style="padding: 10px 12px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #A39A8B">Audio</div>
        <sc-for list="{{auds}}" as="o" hint-placeholder-count="3">
          <button role="menuitemradio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; border: 0; cursor: pointer; text-align: left; background: {{o.bg}}; color: #EDE6DA; font: 500 14px Inter, system-ui, sans-serif">
            <span style="width: 16px; color: #E8B25A">{{o.tick}}</span><span style="flex: 1">{{o.label}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A39A8B">{{o.note}}</span>
          </button>
        </sc-for>
      </div>
      <div role="menu" aria-label="Subtitles" style="display: flex; flex-direction: column; border-left: 1px solid #2A251F; padding-left: 8px">
        <div style="padding: 10px 12px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #A39A8B">Subtitles</div>
        <sc-for list="{{subs}}" as="o" hint-placeholder-count="3">
          <button role="menuitemradio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; border: 0; cursor: pointer; text-align: left; background: {{o.bg}}; color: #EDE6DA; font: 500 14px Inter, system-ui, sans-serif">
            <span style="width: 16px; color: #E8B25A">{{o.tick}}</span><span style="flex: 1">{{o.label}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A39A8B">{{o.note}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 32px 24px; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0)); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">
      <span>01:04:31</span>
      <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="10200" aria-valuenow="3871" aria-valuetext="1 hour 4 minutes 31 seconds" tabindex="0" style="flex: 1; position: relative; height: 20px; display: flex; align-items: center; cursor: pointer">
        <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(237,230,218,0.2)"></div>
        <div style="position: absolute; left: 0; width: 46%; height: 4px; border-radius: 2px; background: rgba(237,230,218,0.35)"></div>
        <div style="position: absolute; left: 0; width: 38%; height: 4px; border-radius: 2px; background: #E8B25A"></div>
        <div style="position: absolute; left: 38%; width: 14px; height: 14px; margin-left: -7px; border-radius: 999px; background: #EDE6DA"></div>
      </div>
      <span style="color: #A39A8B">−01:45:29</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: transparent; color: #EDE6DA; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if>
      </button>
      <button aria-label="Back 10 seconds" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #EDE6DA; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"></path></svg><span style="position: absolute; font-size: 9px; font-weight: 600; padding-top: 2px">10</span></button>
      <button aria-label="Forward 10 seconds" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #EDE6DA; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"></path></svg><span style="position: absolute; font-size: 9px; font-weight: 600; padding-top: 2px">10</span></button>
      <label style="display: flex; align-items: center; gap: 8px; margin-left: 8px; color: #EDE6DA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
        <input type="range" min="0" max="100" value="70" aria-label="Volume" style="width: 96px; accent-color: #EDE6DA">
      </label>
      <div style="flex: 1"></div>
      <button onClick="{{toggleSubs}}" aria-label="Audio and subtitles" aria-expanded="{{sOpenStr}}" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: {{subsBtnBg}}; color: #EDE6DA; display: flex; align-items: center; gap: 8px; font: 500 13px Inter, system-ui, sans-serif; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 13h4M13 13h4M7 16h7"></path></svg>{{subLabel}}</button>
      <button onClick="{{toggleQ}}" aria-label="Quality" aria-expanded="{{qOpenStr}}" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: {{qBtnBg}}; color: #EDE6DA; display: flex; align-items: center; gap: 8px; font: 500 13px Inter, system-ui, sans-serif; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>{{qLabel}}</button>
      <button aria-label="Fullscreen" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #EDE6DA; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A8276">
      <span>Space play/pause</span><span>← → 10 s</span><span>↑ ↓ volume</span><span>F fullscreen</span><span>C captions</span><span>Q quality</span><span>Controls hide after 3 s</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"openMenu":{"editor":"enum","options":["q","s"],"default":"q"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: 'Auto', s: 'Off', a: 'English 5.1', open: this.props.openMenu ?? 'q', playing: true }; }
  renderVals() {
    const st = this.state;
    const notes = { Auto: 'now Original', Original: '1080p · 24 Mbps', '1080p': '8 Mbps', '720p': '4 Mbps · pre-made', '480p': '1.5 Mbps · pre-made' };
    const shown = st.q === 'Auto' ? 'Original' : st.q;
    const item = (label, key, extra) => { const on = st[key] === label; return { label, note: extra ? extra[label] : '', on: on ? 'true' : 'false', tick: on ? '✓' : '', bg: on ? '#2A251F' : 'transparent', pick: () => this.setState({ [key]: label, open: null }) }; };
    return {
      indicator: (st.q === 'Auto' ? 'Auto · ' : '') + shown + ' · Home',
      quals: ['Auto', 'Original', '1080p', '720p', '480p'].map((l) => item(l, 'q', notes)),
      subs: ['Off', 'English', 'English (forced)'].map((l) => item(l, 's', { Off: 'forced if needed', English: '', 'English (forced)': '' })),
      auds: ['English 5.1', 'English Stereo', 'Commentary'].map((l) => item(l, 'a', { 'English 5.1': 'DTS', 'English Stereo': 'AAC', 'Commentary': 'Michael Mann' })),
      qOpen: st.open === 'q', sOpen: st.open === 's',
      qOpenStr: st.open === 'q' ? 'true' : 'false', sOpenStr: st.open === 's' ? 'true' : 'false',
      qBtnBg: st.open === 'q' ? 'rgba(237,230,218,0.16)' : 'transparent',
      subsBtnBg: st.open === 's' ? 'rgba(237,230,218,0.16)' : 'transparent',
      toggleQ: () => this.setState({ open: st.open === 'q' ? null : 'q' }),
      toggleSubs: () => this.setState({ open: st.open === 's' ? null : 's' }),
      qLabel: st.q, subLabel: st.s === 'Off' ? 'Off' : (st.s === 'English' ? 'EN' : 'EN forced'),
      playing: st.playing, paused: !st.playing, playLabel: st.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !st.playing })
    };
  }
}
</script>
</body>
</html>
