<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CineFilm — Robert De Niro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E0C0A}
a{color:#EDE6DA;text-decoration:none}a:hover{color:#E8B25A}
</style>
</helmet>
<div style="background: #0E0C0A; color: #EDE6DA; font-family: Inter, system-ui, sans-serif; min-height: 100vh; padding-bottom: 80px">
  <header style="max-width: 1360px; margin: 0 auto; padding: 24px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 32px">
    <a href="Main.dc.html" style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 30px">CineFilm</a>
    <nav style="display: flex; gap: 24px; font-size: 14px; font-weight: 500">
      <a href="Main.dc.html" style="color: #A39A8B">Home</a>
      <a href="Library.dc.html" style="color: #A39A8B">Library</a>
    </nav>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 24px 40px 0; display: flex; flex-direction: column; gap: 40px">
    <a href="A-Detail.dc.html" style="font-size: 14px; color: #A39A8B">← Heat</a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 32px">
      <div aria-hidden="true" style="width: 160px; height: 160px; border-radius: 999px; background: #1F1B16; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 56px; color: #A39A8B">RD</div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 80px; line-height: 0.95">Robert De Niro</h1>
        <div style="font-size: 15px; color: #D5CCBE">Actor · 2 films in your library</div>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 18px">
      <h2 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 32px">In your library</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 28px 20px">
        <sc-for list="{{films}}" as="f" hint-placeholder-count="2">
          <a href="A-Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px">
            <div style="aspect-ratio: 2 / 3; border-radius: 8px; background: {{f.c}}; padding: 14px; box-sizing: border-box; display: flex; align-items: flex-end; font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; line-height: 1.05; color: rgba(255,248,236,0.9)">{{f.t}}</div>
            <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px">
              <span style="color: #D5CCBE">{{f.t}} · {{f.y}}</span>
              <span style="color: #A39A8B">as {{f.role}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      films: [
        { t: 'Heat', y: 1995, role: 'Neil McCauley', c: '#2B3A47' },
        { t: 'Taxi Driver', y: 1976, role: 'Travis Bickle', c: '#4A2A2A' }
      ]
    };
  }
}
</script>
</body>
</html>
