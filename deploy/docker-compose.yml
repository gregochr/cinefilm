# CineFilm production stack on dockermacmini. Delivered to ~/cinefilm/docker-compose.yml by scripts/deploy.sh;
# run it only through that script (it exports CINEFILM_VERSION and passes ~/cinefilm/.env). Operations: docs/engineering/operations.md
name: cinefilm

services:
  cinefilm-db:
    image: postgres:17
    container_name: cinefilm-db
    environment:
      POSTGRES_DB: cinefilm
      POSTGRES_USER: ${CINEFILM_DB_USER:?set CINEFILM_DB_USER in ~/cinefilm/.env}
      POSTGRES_PASSWORD: ${CINEFILM_DB_PASSWORD:?set CINEFILM_DB_PASSWORD in ~/cinefilm/.env}
    volumes:
      - ${CINEFILM_DATA_DIR:-/home/gregochr/cinefilm-data}/postgres:/var/lib/postgresql/data
    # No published port: only the cinefilm container reaches it, over the compose network.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cinefilm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cinefilm:
    image: ghcr.io/gregochr/cinefilm:${CINEFILM_VERSION:?CINEFILM_VERSION is set by scripts/deploy.sh}
    container_name: cinefilm
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CINEFILM_DB_URL: jdbc:postgresql://cinefilm-db:5432/cinefilm
      TZ: Europe/London
      # TODO(owner): dockermacmini's RAM is not known yet and it is shared with goldenhour. Revisit mem_limit and
      # MaxRAMPercentage once `free -h` is known (and again when ffmpeg/transcoding lands).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 1g
    # Published on loopback only; cinefilm-proxy (below) is the way in, and `tailscale serve --https=8443` the fallback.
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      # Films: ONLY the Movies folder of workhorse's disk, mounted read-only on the host (operations.md).
      # rslave so a share that mounts after the container starts still appears inside it.
      - type: bind
        source: /mnt/workhorse-films
        target: /media
        read_only: true
        bind:
          propagation: rslave
      - ${CINEFILM_DATA_DIR:-/home/gregochr/cinefilm-data}/logs:/app/logs
      - ${CINEFILM_DATA_DIR:-/home/gregochr/cinefilm-data}/cache:/app/cache
      # Posters and backdrops imported from Plex: a persistent data mount, not a cache (Plex's copies cannot be
      # fetched again once Plex is gone). Backed up with the database.
      - ${CINEFILM_DATA_DIR:-/home/gregochr/cinefilm-data}/artwork:/app/artwork
    depends_on:
      cinefilm-db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/container >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS for https://${CINEFILM_DOMAIN}, tailnet only (docs/engineering/operations.md, "Custom domain"). Caddy with the
  # Cloudflare DNS module (deploy/caddy/), certificates by DNS challenge, so it never needs port 80 (goldenhour's).
  # Host networking so it can bind the tailnet addresses and reach the app on 127.0.0.1:8090; the Caddyfile binds ONLY
  # those two addresses. It gets just the variables below, never the whole .env (database password, tokens).
  cinefilm-proxy:
    image: ghcr.io/gregochr/cinefilm-caddy:${CINEFILM_VERSION:?CINEFILM_VERSION is set by scripts/deploy.sh}
    container_name: cinefilm-proxy
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in ~/cinefilm/.env (a Zone, DNS, Edit token for chrisjgregory.dev only)}
      CINEFILM_DOMAIN: ${CINEFILM_DOMAIN:-cinefilm.chrisjgregory.dev}
      CINEFILM_TAILNET_IPV4: ${CINEFILM_TAILNET_IPV4:?set CINEFILM_TAILNET_IPV4 in ~/cinefilm/.env (this host's 100.x tailnet address)}
      CINEFILM_TAILNET_IPV6: ${CINEFILM_TAILNET_IPV6:?set CINEFILM_TAILNET_IPV6 in ~/cinefilm/.env (this host's fd7a: tailnet address)}
    volumes:
      # Certificates and the ACME account persist here, so a redeploy never re-issues (Let's Encrypt rate limits).
      - ${CINEFILM_DATA_DIR:-/home/gregochr/cinefilm-data}/caddy/data:/data
      - ${CINEFILM_DATA_DIR:-/home/gregochr/cinefilm-data}/caddy/config:/config
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    # tailscale0 can come up after Docker at boot: the bind then fails, Caddy exits and Docker retries until it works.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 \"$$CINEFILM_TAILNET_IPV4\" 443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
