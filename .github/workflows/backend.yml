name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The full verify includes the integration package (Testcontainers Postgres 17; ubuntu runners have Docker).
      - name: Verify
        run: cd backend && ./mvnw clean verify --batch-mode --no-transfer-progress
      - name: Integration test counts
        run: |
          total=0
          for f in backend/target/surefire-reports/TEST-gregochr.cinefilm.integration.*IntegrationTest.xml; do
            [ -e "$f" ] || { echo "No integration test reports found"; exit 1; }
            n=$(grep -o '<testsuite [^>]*' "$f" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')
            echo "$(basename "$f"): $n tests"
            total=$((total + n))
          done
          echo "Integration tests run: $total"
          [ "$total" -gt 0 ]
