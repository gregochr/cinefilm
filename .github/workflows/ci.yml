name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter and NO `paths:` filter here, deliberately.
  #
  # `branches: [main]` would mean "only PRs whose BASE is main": a stacked PR (opened against
  # another feature branch) would never run CI. Unfiltered, CI runs for a PR against any base.
  pull_request:
  # Reusable by later deploy / mutation workflows (they call this and gate on it).
  workflow_call:
  # Lets dependabot-auto-merge.yml build `main` after a GITHUB_TOKEN merge (such a merge starts
  # no push workflows).
  workflow_dispatch:

# Least privilege for every job: they only check out and read the repository. Artifact upload, the Actions
# cache and the job summary use the runner's own tokens, not the GITHUB_TOKEN scopes. Called from deploy.yml, whose
# top-level `contents: read` is the same, so the reusable-workflow call is not narrowed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Docs-only detection ──────────────────────────────────────────────────────
  # A docs/ or *.md change cannot break a test, so running the full suite for one proves nothing.
  #
  # The obvious approach — `paths-ignore` (or `paths:`) on the trigger — is a TRAP. The workflow
  # filtered out by path never runs, so its checks never report; if those checks are ever required
  # the PR sits BLOCKED forever with no way to satisfy it (and the old backend.yml / frontend.yml,
  # which had `paths:` filters, were exactly this).
  #
  # So the jobs always run and always report; only their expensive STEPS are skipped. A docs-only
  # PR still shows both checks green, in seconds. Step-level `if:` and not job-level: a job-level
  # `if:` reports "skipped", which blocks a required check rather than satisfying it.
  #
  # Fail-safe by construction: every ambiguous case (not a PR, empty diff, any non-doc path, any
  # error) yields docs_only=false and the full suite runs. The only route to skipping is an
  # explicit, non-empty diff of documentation alone.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        name: Classify the diff
        run: |
          set -euo pipefail
          # push to main, workflow_dispatch and workflow_call (the deploy path) ALWAYS run in full —
          # a release must be verified whatever it happens to contain.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}, not pull_request — running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The classification lives in scripts/ci-docs-only.sh (tested by scripts/test/ci-docs-only.test.sh):
          # documentation is *.md anywhere or anything under docs/; renames count as delete + add so moving
          # code into docs/ is still code. Prints docs_only=true|false; any doubt is false.
          bash scripts/ci-docs-only.sh \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}' >> "$GITHUB_OUTPUT"

  # ── Backend ──────────────────────────────────────────────────────────────────
  # Required job name — stable string, read by dependabot-auto-merge.yml.
  backend:
    needs: changes
    name: Backend — Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # diff-cover needs the base branch's history to compute the PR diff.
          fetch-depth: 0

      - name: Set up JDK 25
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # The library scan's real-tool test (RealToolsTest) generates a clip with ffmpeg, probes it with ffprobe and
      # extracts its mov_text subtitle to WebVTT. It skips itself where the tools are missing (the dev Mac), so the
      # install must be here for it to count.
      # On 2026-11-11 the runners could not resolve the Ubuntu mirrors; one `apt-get update` took ~6 minutes of 20 s
      # DNS waits (apt's own timeouts do not cover them), so retries cannot help and the step hung until the job's
      # 20-minute timeout. scripts/ci-install-ffmpeg.sh has its own 5-minute budget so a clear error prints first;
      # the step timeout is only a backstop above it.
      - name: Install ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 7
        run: bash scripts/ci-install-ffmpeg.sh

      # The full verify includes the integration package (Testcontainers Postgres 17; ubuntu runners
      # ship Docker), plus Checkstyle, JaCoCo per-class and bundle checks, and SpotBugs + FindSecBugs.
      - name: Build, test, and verify coverage
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          chmod +x backend/mvnw
          cd backend && ./mvnw clean verify --batch-mode --no-transfer-progress

      # So "0 integration tests ran" cannot pass as green.
      - name: Integration test counts
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          total=0
          for f in backend/target/surefire-reports/TEST-gregochr.cinefilm.integration.*IntegrationTest.xml; do
            [ -e "$f" ] || { echo "No integration test reports found"; exit 1; }
            n=$(grep -o '<testsuite [^>]*' "$f" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')
            echo "$(basename "$f"): $n tests"
            total=$((total + n))
          done
          echo "Integration tests run: $total"
          [ "$total" -gt 0 ]

      # Changed-lines coverage: at least 90% of the lines a PR adds or changes under backend/src/main
      # must be covered (the per-class and bundle floors cannot see a PR that adds untested code to an
      # already-high class). diff-cover reads the JaCoCo XML, whose sourcefile paths are package-relative
      # (gregochr/cinefilm/.../Foo.java), so `--src-roots` maps them onto backend/src/main/java; tests and
      # resources are absent from the report and never count. Run from the repo root so the diff paths
      # (backend/src/main/java/...) line up. A wrong mapping reports "No lines with coverage
      # information" and passes, so the local proof in dev-and-testing.md must show real percentages.
      # Line coverage only. Pull requests only: a push to main has no PR diff.
      - name: Set up Python (diff-cover)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Changed-lines coverage (diff-cover, 90%)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          pip install diff-cover==10.0.0
          git fetch --no-tags origin "${{ github.base_ref }}"
          set +e
          diff-cover backend/target/site/jacoco/jacoco.xml \
            --src-roots backend/src/main/java \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=90 \
            --format markdown:"$RUNNER_TEMP/diff-cover.md"
          STATUS=$?
          set -e
          {
            echo "### Changed-lines coverage (backend, minimum 90%)"
            cat "$RUNNER_TEMP/diff-cover.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # NOTE: there is deliberately NO separate FindSecBugs step: `clean verify` already runs the
      # SpotBugs + FindSecBugs `check` bound to the verify phase. Change the pom, not this file, to
      # make the analysis stricter.

      # Produced by the forked spotbugs:spotbugs run inside the verify-phase check goal.
      - name: Upload SpotBugs report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # Inputs for the `sonar` job, whose Java analysis needs the compiled classes AND the classpath to resolve Spring,
      # Hibernate and Jakarta types. The plugin goal is invoked directly (no lifecycle phase), so it cannot re-run tests
      # or touch target/classes; it only copies the already-resolved jars. Version pinned on the command line.
      - name: Copy dependency jars (for SonarQube Cloud)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cd backend && ./mvnw --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:copy-dependencies \
            -DincludeScope=test -DoutputDirectory=target/sonar-libs

      # One short-lived artifact, laid out relative to backend/target (its common root): the sonar job downloads it
      # to backend/target.
      - name: Upload Sonar inputs (classes, test classes, dependency jars)
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar-inputs
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/sonar-libs/
          retention-days: 1
          if-no-files-found: error

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so a required check is satisfied."

  # ── Frontend ─────────────────────────────────────────────────────────────────
  # Required job name — stable string, read by dependabot-auto-merge.yml.
  frontend:
    needs: changes
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    # Caps what a genuinely hung test costs (GitHub's default ceiling is 360 minutes).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # diff-cover needs the base branch's history to compute the PR diff.
          fetch-depth: 0

      - name: Set up Node 24
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm ci

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run lint

      # Fails on any file that `npm run format` would change.
      - name: Format check (Prettier)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run format:check

      - name: Unit tests + coverage floor (Vitest)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run test:coverage

      # Changed-lines coverage: at least 90% of the lines a PR adds or changes under frontend/src
      # must be covered. diff-cover reads coverage/lcov.info and ignores diff lines in files absent
      # from lcov, so tests, src/test/** and src/main.jsx never count. A PR that touches no covered
      # source reports "No lines with coverage information in this diff" and exits 0.
      # ⚠️ lcov `SF:` paths are relative to frontend/ but diff-cover resolves them against the repo
      # root, and run from frontend/ it silently matches NOTHING and passes. So the step prefixes
      # `SF:` with `frontend/` and runs from the repo root.
      # Line coverage only. Pull requests only: a push to main has no PR diff.
      - name: Set up Python (diff-cover)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Changed-lines coverage (diff-cover, 90%)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          pip install diff-cover==10.0.0
          git fetch --no-tags origin "${{ github.base_ref }}"
          sed 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info > "$RUNNER_TEMP/lcov-root.info"
          set +e
          diff-cover "$RUNNER_TEMP/lcov-root.info" \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=90 \
            --format markdown:"$RUNNER_TEMP/diff-cover.md"
          STATUS=$?
          set -e
          {
            echo "### Changed-lines coverage (frontend, minimum 90%)"
            cat "$RUNNER_TEMP/diff-cover.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # ⚠️ NOT a bare `npm audit`: scripts/npm-audit.sh runs the audit under npm 11 (so a registry
      # problem names the endpoint that failed) and retries ONLY on transport errors, never on a
      # finding. The script carries the full account.
      - name: Dependency audit (frontend, high)
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/npm-audit.sh frontend high

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run build

      # lcov for the `sonar` job; short-lived. The sonar job rewrites the SF: paths in its own copy.
      - name: Upload lcov (for SonarQube Cloud)
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lcov
          path: frontend/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so a required check is satisfied."

  # ── Shell scripts ────────────────────────────────────────────────────────────
  # ShellCheck proves the scripts parse and are tidy; the tests (scripts/test/*.test.sh) run the real
  # scripts against stub npx/sleep on PATH and throwaway git repos, so npm-audit.sh's retry rules,
  # ci-docs-only.sh's classification and ci-install-ffmpeg.sh's time budget are proven, not assumed. No network, a few seconds.
  # Required job name — stable string. Step-level `if:` and a skipped echo step like every job here.
  shell:
    needs: changes
    name: Shell — ShellCheck & script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      # PINNED, and not to the runner's preinstalled shellcheck: "green locally" must say something about CI.
      # -o check-unassigned-uppercase: SC2154 is off by default for uppercase names.
      - name: ShellCheck (pinned, with unassigned-uppercase detection)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            -x -o check-unassigned-uppercase scripts/*.sh scripts/lib/*.sh scripts/test/*.sh

      # PINNED like ShellCheck above. The image bundles shellcheck, so `run:` blocks are shellchecked too.
      # Run `actionlint` locally from the repo root; it reads .github/actionlint.yaml.
      - name: actionlint (pinned)
        if: needs.changes.outputs.docs_only != 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Run scripts/test/*.test.sh
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/test/run-all.sh

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so a required check is satisfied."

  # ── Docker image ─────────────────────────────────────────────────────────────
  # Builds the one production image (SPA + jar + ffmpeg runtime) WITHOUT pushing, so a broken Dockerfile fails a PR
  # rather than a release (deploy.yml reuses this workflow and then builds and pushes for real). Then smoke-checks
  # the image: non-root, ffmpeg/ffprobe/vainfo present. Same docs-only guard as every job.
  docker:
    needs: changes
    name: Docker — image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.docs_only != 'true'

      - name: Build the image (no push)
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: cinefilm:ci
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The v0.2.0 deploy died on a YAML error in this file, which nothing had ever parsed. Dummy values for every
      # required `${VAR:?}` guard (and an empty .env for env_file); --quiet exits non-zero on any parse or guard failure.
      - name: Validate deploy/docker-compose.yml
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CINEFILM_VERSION: v0.0.0-ci
          CINEFILM_DB_USER: ci
          CINEFILM_DB_PASSWORD: ci-dummy-password
          CLOUDFLARE_API_TOKEN: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CINEFILM_TAILNET_IPV4: 100.64.0.1
          CINEFILM_TAILNET_IPV6: fd7a:115c:a1e0::1
        run: |
          set -euo pipefail
          touch deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet

      - name: Check the image
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          docker image ls cinefilm:ci
          size="$(docker image inspect cinefilm:ci --format '{{.Size}}')"
          echo "Image size: $((size / 1024 / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(docker run --rm --entrypoint id cinefilm:ci -u)" = "1001" ]
          docker run --rm --entrypoint ffmpeg cinefilm:ci -version > /dev/null
          docker run --rm --entrypoint ffprobe cinefilm:ci -version > /dev/null
          docker run --rm --entrypoint which cinefilm:ci vainfo
          docker run --rm --entrypoint sh cinefilm:ci -c 'ls /app/app.jar && date +%Z'
          # /actuator/info reads git.properties from the jar: prove it is there with the commit the image was built from.
          cid="$(docker create cinefilm:ci)"
          docker cp "$cid:/app/app.jar" "$RUNNER_TEMP/app.jar"
          docker rm "$cid" > /dev/null
          unzip -p "$RUNNER_TEMP/app.jar" BOOT-INF/classes/git.properties | tee "$RUNNER_TEMP/git.properties"
          grep -qx "git.commit.id.full=${{ github.sha }}" "$RUNNER_TEMP/git.properties"
          # Write to a file, then grep it: `producer | grep -q` lets grep exit on its first match and SIGPIPE the producer,
          # which pipefail turns into a failed step depending on timing.
          unzip -p "$RUNNER_TEMP/app.jar" BOOT-INF/classes/static/index.html > "$RUNNER_TEMP/index.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/index.html"

      # The tailnet-only reverse proxy image (Caddy + the Cloudflare DNS module, deploy/caddy/). Built here without pushing
      # so a broken Dockerfile or Caddyfile fails the PR; deploy.yml builds and pushes it next to the app image.
      - name: Build the Caddy proxy image (no push)
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy/caddy
          push: false
          load: true
          tags: cinefilm-caddy:ci
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Check the Caddy proxy image
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint caddy cinefilm-caddy:ci version
          # Capture first, then grep: piping list-modules into `grep -q` SIGPIPEs caddy ("broken pipe") under pipefail.
          modules="$(docker run --rm --entrypoint caddy cinefilm-caddy:ci list-modules)"
          grep -qx 'dns.providers.cloudflare' <<<"$modules"
          # The entrypoint refuses a malformed token (here with a trailing space) without printing it, and starts nothing.
          if docker run --rm -e "CLOUDFLARE_API_TOKEN=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA " cinefilm-caddy:ci > "$RUNNER_TEMP/entrypoint.out" 2>&1; then
            echo "the entrypoint accepted a malformed token"; exit 1
          fi
          grep -q 'CLOUDFLARE_API_TOKEN is malformed' "$RUNNER_TEMP/entrypoint.out"
          # An explicit if, not `! grep`: under set -e a bare `!` never aborts the step, so that check could not fail.
          if grep -q 'AAAAAAAAAA' "$RUNNER_TEMP/entrypoint.out"; then echo "the entrypoint printed the token"; exit 1; fi
          # The baked-in Caddyfile parses and provisions with placeholder values (no network, nothing is bound or issued; the module only
          # checks that the token looks like a Cloudflare one, 40 characters, hence the placeholder's shape).
          docker run --rm \
            -e CINEFILM_DOMAIN=cinefilm.example.test \
            -e CINEFILM_TAILNET_IPV4=100.64.0.1 \
            -e CINEFILM_TAILNET_IPV6=fd7a:115c:a1e0::1 \
            -e CLOUDFLARE_API_TOKEN=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            --entrypoint caddy cinefilm-caddy:ci validate --config /etc/caddy/Caddyfile

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so a required check is satisfied."

  # ── SonarQube Cloud ──────────────────────────────────────────────────────────
  # Static analysis of the backend, frontend, scripts, Dockerfiles and workflows, with the quality gate on NEW code
  # (-Dsonar.qualitygate.wait=true makes this job's exit code the gate). CI-based, not Automatic Analysis, because
  # Java analysis needs compiled classes and the gate should see real coverage: so the inputs are ARTIFACTS from the
  # backend and frontend jobs (classes, JaCoCo XML, lcov), downloaded into the paths sonar-project.properties names,
  # and nothing is rebuilt here. Project config: sonar-project.properties at the repo root.
  #
  # NOT a required check: it runs advisory first while the rule profile is tuned. Same docs-only pattern as every job
  # (step-level `if:`, a final echo step). If backend or frontend fails this job is skipped by default `needs`
  # semantics, deliberately: there is nothing valid to analyse.
  #
  # No token, no failure: SONAR_TOKEN is empty for PRs from forks, and in deploy.yml's reuse of this workflow
  # (workflow_call does not inherit secrets, and a release needs no Sonar run). Secrets cannot be read in `if:`, so the
  # job exposes it as env and the steps test env.SONAR_TOKEN. contents: read is all the scan needs: the PR
  # decoration is done by the SonarQube Cloud GitHub App, not by this token.
  sonar:
    needs: [changes, backend, frontend]
    name: SonarQube Cloud — Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN != ''
        with:
          # New-code detection and blame need the full history.
          fetch-depth: 0

      - name: Download compiled classes, test classes and dependency jars
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar-inputs
          path: backend/target

      - name: Download JaCoCo report
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Download frontend lcov
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-lcov
          path: frontend/coverage

      # lcov `SF:` paths are relative to frontend/; the scanner resolves them from the repo root (the same
      # prefixing the frontend job's diff-cover step does, here on this job's own copy).
      - name: Make lcov paths root-relative
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN != ''
        run: sed 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info > frontend/coverage/lcov.sonar.info

      - name: SonarQube Cloud scan (waits for the quality gate)
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: No SONAR_TOKEN — analysis skipped
        if: needs.changes.outputs.docs_only != 'true' && env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not available (a PR from a fork, or a reuse of this workflow that does not pass secrets)."
          echo "SonarQube Cloud analysis was skipped deliberately; this job reports success."

      - name: Documentation-only change — suite skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Every changed path is documentation (*.md or docs/**)."
          echo "The suite was skipped deliberately — see the 'Detect docs-only change' job."
          echo "This check reports success so a required check is satisfied."
